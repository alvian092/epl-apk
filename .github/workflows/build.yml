name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip git
          sudo apt install -y libtinfo5 libncurses5 || sudo apt install -y libtinfo6 libncurses6
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Init buildozer
        run: buildozer init || true
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: semualiga-apk
          path: bin/*.apk
          if-no-files-found: error
