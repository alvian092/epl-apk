name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Buildozer deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libssl-dev libffi-dev
          pip install buildozer cython
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: semualiga-apk
          path: bin/*.apk
